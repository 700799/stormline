<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stormline — autonomous weather ops</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root {
    --bg: #0b0f14; --panel: #11161d; --line: #1f2937; --text: #e8eef5; --dim: #8b9bad;
    --safe: #22c55e; --watch: #f59e0b; --threatened: #ef4444; --handled: #3b82f6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    display: grid; grid-template-rows: 64px 1fr; grid-template-columns: 1fr 460px;
    grid-template-areas: "header header" "map side";
  }
  /* ── header ── */
  header {
    grid-area: header; display: flex; align-items: center; gap: 22px; padding: 0 20px;
    background: var(--panel); border-bottom: 1px solid var(--line); font-size: 17px;
  }
  .brand { font-size: 24px; font-weight: 800; letter-spacing: .04em; }
  .brand span { color: var(--threatened); }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--dim); display: inline-block; margin-right: 6px; }
  .dot.live { background: var(--safe); box-shadow: 0 0 8px var(--safe); }
  .dot.down { background: var(--threatened); }
  .stat b { font-size: 19px; }
  .spacer { flex: 1; }
  button {
    font: inherit; font-weight: 700; font-size: 16px; padding: 10px 18px; cursor: pointer;
    border-radius: 8px; border: 1px solid var(--line); background: #1d2733; color: var(--text);
  }
  button:hover { background: #27374a; }
  button.danger { background: #7f1d1d; border-color: #b91c1c; }
  button.danger:hover { background: #991b1b; }
  /* ── map ── */
  #map { grid-area: map; background: #0b0f14; }
  .leaflet-container { background: #0d1117; }
  /* ── side column ── */
  aside { grid-area: side; display: grid; grid-template-rows: auto 1fr; overflow: hidden; border-left: 1px solid var(--line); }
  .cards { padding: 12px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: var(--bg); }
  .card { background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--dim); border-radius: 8px; padding: 10px 12px; }
  .card h3 { margin: 0 0 4px; font-size: 16px; }
  .card .meta { color: var(--dim); font-size: 13px; }
  .card .last { font-size: 13px; margin-top: 6px; color: #c7d4e2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .pill { float: right; font-size: 12px; font-weight: 800; letter-spacing: .06em; padding: 3px 9px; border-radius: 999px; color: #06090d; }
  /* ── feed (the autonomy proof — most prominent) ── */
  .feedwrap { display: grid; grid-template-rows: auto 1fr; overflow: hidden; border-top: 1px solid var(--line); }
  .feedwrap h2 { margin: 0; padding: 12px 16px 8px; font-size: 14px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
  #feed { overflow-y: auto; padding: 0 14px 16px; }
  .ev { padding: 10px 12px; margin-bottom: 8px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font-size: 15.5px; line-height: 1.45; }
  .ev .t { color: var(--dim); font-size: 12.5px; margin-right: 8px; font-variant-numeric: tabular-nums; }
  .ev .tag { font-size: 11.5px; font-weight: 800; letter-spacing: .08em; padding: 2px 8px; border-radius: 4px; margin-right: 8px; color: #06090d; }
  .ev.reasoning { border-left: 6px solid #a78bfa; font-size: 16.5px; }
  .ev.reasoning .tag { background: #a78bfa; }
  .ev.action { border-left: 6px solid var(--handled); }
  .ev.action .tag { background: var(--handled); color: #fff; }
  .ev.weather { border-left: 6px solid var(--watch); }
  .ev.weather .tag { background: var(--watch); }
  .ev.status { border-left: 6px solid var(--threatened); }
  .ev.status .tag { background: var(--threatened); color: #fff; }
  .ev.system, .ev.error { border-left: 6px solid var(--dim); color: var(--dim); font-size: 14px; }
  .ev.system .tag, .ev.error .tag { background: var(--dim); }
  .ev.error { border-left-color: var(--threatened); color: #fda4af; }
</style>
</head>
<body>
<header>
  <div class="brand">STORM<span>LINE</span></div>
  <div class="stat"><span class="dot" id="dot"></span><span id="conn">connecting…</span></div>
  <div class="stat">tick <b id="tick">0</b></div>
  <div class="stat" id="weatherline">weather: clear</div>
  <div class="stat">actions <b id="actions">0</b></div>
  <div class="spacer"></div>
  <button class="danger" id="inject">⚡ Inject storm</button>
  <button id="clear">Reset</button>
</header>

<div id="map"></div>

<aside>
  <div class="cards" id="cards"></div>
  <div class="feedwrap">
    <h2>Agent reasoning &amp; actions — live</h2>
    <div id="feed"></div>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  const COLORS = { safe: '#22c55e', watch: '#f59e0b', threatened: '#ef4444', handled: '#3b82f6' };

  // ── map ──
  const map = L.map('map', { zoomControl: false, attributionControl: true });
  L.control.zoom({ position: 'bottomleft' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains: 'abcd', maxZoom: 19,
  }).addTo(map);
  map.setView([37.8, -122.15], 9); // Bay Area; refit to assets on first state

  const assetLayers = new Map(); // id → Leaflet layer
  let stormCircle = null, stormDot = null, stormHeading = null, didFit = false;

  function upsertAssetLayer(a) {
    const color = COLORS[a.status] ?? '#8b9bad';
    let layer = assetLayers.get(a.id);
    if (!layer) {
      layer =
        a.geometry.type === 'polyline'
          ? L.polyline(a.geometry.coordinates, { weight: 6, opacity: 0.95 })
          : L.circleMarker(a.geometry.coordinates, { radius: 11, weight: 3, fillOpacity: 0.85 });
      layer.bindTooltip(a.name, { direction: 'top' });
      layer.addTo(map);
      assetLayers.set(a.id, layer);
    }
    layer.setStyle({ color, fillColor: color });
  }

  function updateStorm(w) {
    if (!w) {
      [stormCircle, stormDot, stormHeading].forEach((l) => l && map.removeLayer(l));
      stormCircle = stormDot = stormHeading = null;
      return;
    }
    const c = [w.center.lat, w.center.lon];
    const head = [w.center.lat + w.movement.dLat * 3, w.center.lon + w.movement.dLon * 3];
    if (!stormCircle) {
      stormCircle = L.circle(c, { radius: w.radius_km * 1000, color: '#ef4444', weight: 2, fillColor: '#ef4444', fillOpacity: 0.22 }).addTo(map);
      stormDot = L.circleMarker(c, { radius: 5, color: '#fff', fillColor: '#ef4444', fillOpacity: 1 }).addTo(map);
      stormHeading = L.polyline([c, head], { color: '#ef4444', weight: 2, dashArray: '6 6' }).addTo(map);
    } else {
      stormCircle.setLatLng(c).setRadius(w.radius_km * 1000);
      stormDot.setLatLng(c);
      stormHeading.setLatLngs([c, head]);
    }
  }

  // ── cards ──
  const cardsEl = document.getElementById('cards');
  function renderCards(assets) {
    cardsEl.innerHTML = assets
      .map((a) => {
        const color = COLORS[a.status] ?? '#8b9bad';
        const dist = a.distanceKm != null ? ` · ${a.distanceKm} km` : '';
        const last = a.lastAction ? `<div class="last">↳ ${esc(a.lastAction.summary)}</div>` : '';
        return `<div class="card" style="border-left-color:${color}">
          <h3>${esc(a.name)} <span class="pill" style="background:${color}">${a.status.toUpperCase()}</span></h3>
          <div class="meta">${a.type.replaceAll('_', ' ')}${dist}</div>${last}</div>`;
      })
      .join('');
  }

  // ── feed (id-deduped; state replays last 50, live `feed` events stream in) ──
  const feedEl = document.getElementById('feed');
  const feedMap = new Map();
  function addFeed(ev) {
    if (feedMap.has(ev.id)) return false;
    feedMap.set(ev.id, ev);
    return true;
  }
  function renderFeed() {
    const items = [...feedMap.values()].sort((x, y) => y.id - x.id).slice(0, 80);
    feedEl.innerHTML = items
      .map(
        (ev) => `<div class="ev ${ev.type}"><span class="tag">${ev.type.toUpperCase()}</span><span class="t">${ev.ts.slice(11, 19)}Z</span>${esc(ev.text)}</div>`
      )
      .join('');
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

  // ── header + controls ──
  const dot = document.getElementById('dot'), conn = document.getElementById('conn');
  document.getElementById('inject').onclick = () =>
    fetch('/api/demo/inject-storm', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ intensity: 'severe', target: 'route-7' }) });
  document.getElementById('clear').onclick = () => fetch('/api/demo/clear', { method: 'POST' });

  function applyState(s) {
    document.getElementById('tick').textContent = s.tick;
    document.getElementById('actions').textContent = s.actionsTaken.length;
    document.getElementById('weatherline').textContent = s.weather
      ? `⛈ ${s.weather.severity} ${s.weather.kind} — ETA ~${s.weather.eta_minutes} min (conf ${s.weather.confidence})`
      : 'weather: clear';
    s.assets.forEach(upsertAssetLayer);
    if (!didFit) {
      const all = s.assets.flatMap((a) => (a.geometry.type === 'polyline' ? a.geometry.coordinates : [a.geometry.coordinates]));
      map.fitBounds(L.latLngBounds(all).pad(0.12));
      didFit = true;
    }
    updateStorm(s.weather);
    renderCards(s.assets);
    let changed = false;
    for (const ev of s.feed) changed = addFeed(ev) || changed;
    if (changed) renderFeed();
  }

  // ── SSE ──
  const es = new EventSource('/api/stream');
  es.onopen = () => { dot.className = 'dot live'; conn.textContent = 'live'; };
  es.onerror = () => { dot.className = 'dot down'; conn.textContent = 'reconnecting…'; };
  es.addEventListener('state', (e) => applyState(JSON.parse(e.data)));
  es.addEventListener('feed', (e) => { if (addFeed(JSON.parse(e.data))) renderFeed(); });
</script>
</body>
</html>
