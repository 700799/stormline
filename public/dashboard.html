<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stormline — autonomous weather ops</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root {
    --bg: #0b0f14; --panel: #11161d; --line: #1f2937; --text: #e8eef5; --dim: #8b9bad;
    --safe: #22c55e; --watch: #f59e0b; --threatened: #ef4444; --handled: #3b82f6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    display: grid; grid-template-rows: 64px 1fr 300px; grid-template-columns: 1fr 460px;
    grid-template-areas: "header header" "map side" "openui openui";
  }
  /* ── header ── */
  header {
    grid-area: header; display: flex; align-items: center; gap: 20px; padding: 0 20px;
    background: var(--panel); border-bottom: 1px solid var(--line); font-size: 16px;
  }
  .brand { font-size: 24px; font-weight: 800; letter-spacing: .04em; }
  .brand span { color: var(--threatened); }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--dim); display: inline-block; margin-right: 6px; }
  .dot.live { background: var(--safe); box-shadow: 0 0 8px var(--safe); }
  .dot.down { background: var(--threatened); }
  .stat { color: var(--dim); white-space: nowrap; }
  .stat b { font-size: 21px; color: var(--text); font-variant-numeric: tabular-nums; }
  .stat.score b { color: #a78bfa; }
  .stat.score.blocked b { color: var(--watch); }
  #weatherline { font-weight: 600; }
  #weatherline.weather-alert { color: #fecaca; animation: blinkText 1.2s ease-in-out infinite alternate; }
  @keyframes blinkText { to { opacity: .5; } }
  .spacer { flex: 1; }
  button, select {
    font: inherit; font-weight: 700; font-size: 15px; padding: 9px 14px; cursor: pointer;
    border-radius: 8px; border: 1px solid var(--line); background: #1d2733; color: var(--text);
  }
  button:hover { background: #27374a; }
  button.danger { background: #7f1d1d; border-color: #b91c1c; }
  button.danger:hover { background: #991b1b; }
  /* ── map ── */
  #map { grid-area: map; background: #0b0f14; }
  .leaflet-container { background: #0d1117; }
  path.storm-pulse { animation: stormPulse 1.8s ease-in-out infinite alternate; }
  @keyframes stormPulse { from { fill-opacity: .14; } to { fill-opacity: .34; } }
  path.threat-pulse { animation: threatPulse 1s ease-in-out infinite alternate; }
  @keyframes threatPulse { from { stroke-opacity: 1; } to { stroke-opacity: .3; } }
  path.ping { transform-box: fill-box; transform-origin: center; animation: pingAnim 1.3s ease-out forwards; }
  @keyframes pingAnim { 0% { transform: scale(.25); stroke-opacity: 1; } 100% { transform: scale(3.6); stroke-opacity: 0; } }
  /* ── side column ── */
  aside { grid-area: side; display: grid; grid-template-rows: auto 1fr; overflow: hidden; border-left: 1px solid var(--line); }
  .cards { padding: 12px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: var(--bg); }
  .card { background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--dim); border-radius: 8px; padding: 10px 12px; }
  .card.fresh { animation: cardFlash 1.4s ease-out; }
  @keyframes cardFlash { 0% { box-shadow: 0 0 0 4px var(--handled); } 100% { box-shadow: 0 0 0 0 transparent; } }
  .card h3 { margin: 0 0 4px; font-size: 16px; }
  .card .meta { color: var(--dim); font-size: 13px; }
  .card .last { font-size: 13px; margin-top: 6px; color: #c7d4e2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .pill { float: right; font-size: 12px; font-weight: 800; letter-spacing: .06em; padding: 3px 9px; border-radius: 999px; color: #06090d; }
  /* ── feed (the autonomy proof — most prominent) ── */
  .feedwrap { display: grid; grid-template-rows: auto 1fr; overflow: hidden; border-top: 1px solid var(--line); }
  .feedwrap h2 { margin: 0; padding: 12px 16px 8px; font-size: 14px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
  #feed { overflow-y: auto; padding: 0 14px 16px; }
  .ev { padding: 10px 12px; margin-bottom: 8px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font-size: 15.5px; line-height: 1.45; animation: evIn .3s ease-out; }
  @keyframes evIn { from { transform: translateY(-8px); opacity: 0; } }
  .ev .t { color: var(--dim); font-size: 12.5px; margin-right: 8px; font-variant-numeric: tabular-nums; }
  .ev .tag { font-size: 11.5px; font-weight: 800; letter-spacing: .08em; padding: 2px 8px; border-radius: 4px; margin-right: 8px; color: #06090d; }
  .ev.reasoning { border-left: 6px solid #a78bfa; font-size: 16.5px; }
  .ev.reasoning .tag { background: #a78bfa; }
  .ev.action { border-left: 6px solid var(--handled); }
  .ev.action .tag { background: var(--handled); color: #fff; }
  .ev.weather { border-left: 6px solid var(--watch); }
  .ev.weather .tag { background: var(--watch); }
  .ev.status { border-left: 6px solid var(--threatened); }
  .ev.status .tag { background: var(--threatened); color: #fff; }
  .ev.system, .ev.error { border-left: 6px solid var(--dim); color: var(--dim); font-size: 14px; }
  .ev.system .tag, .ev.error .tag { background: var(--dim); }
  .ev.error { border-left-color: var(--threatened); color: #fda4af; }
  /* ── OpenUI panel: generated status card + live [AGENT LOG] terminal ── */
  #openui {
    grid-area: openui; display: grid; grid-template-columns: 480px 1fr; gap: 0;
    border-top: 1px solid var(--line); background: var(--bg); overflow: hidden;
  }
  #openui .box { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  #openui .box + .box { border-left: 1px solid var(--line); }
  #openui h2 {
    margin: 0; padding: 10px 16px 8px; font-size: 13px; letter-spacing: .14em;
    color: var(--dim); text-transform: uppercase; display: flex; align-items: center; gap: 10px;
  }
  .badge { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 4px; letter-spacing: .05em; text-transform: none; }
  .badge.gen { background: #14532d; color: #86efac; }
  .badge.fallback { background: #4a3b10; color: #fcd34d; }
  .badge.err { background: #7f1d1d; color: #fecaca; }
  #openui-card { overflow-y: auto; padding: 0 14px 14px; }
  #openui-card iframe { width: 100%; height: 100%; min-height: 210px; border: 0; border-radius: 8px; background: var(--panel); }
  .localcard { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; font-size: 15px; }
  .localcard .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .localcard .row:last-child { border-bottom: 0; }
  .localcard b { font-variant-numeric: tabular-nums; }
  #agentlog {
    overflow-y: auto; margin: 0 14px 14px; padding: 12px 14px; border-radius: 8px;
    background: #060a0e; border: 1px solid var(--line);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; line-height: 1.5;
    color: #7ee787; white-space: pre-wrap; word-break: break-word;
  }
  #agentlog .ln { margin-bottom: 6px; }
  #agentlog .ln .t { color: #3d5260; margin-right: 8px; }
</style>
</head>
<body>
<header>
  <div class="brand">STORM<span>LINE</span></div>
  <div class="stat"><span class="dot" id="dot"></span><span id="conn">connecting…</span></div>
  <div class="stat">tick <b id="tick">0</b></div>
  <div class="stat score">decisions <b id="st-dec">0</b></div>
  <div class="stat score">actions <b id="st-act">0</b></div>
  <div class="stat score blocked" title="duplicate actions the agent refused to repeat — idempotency, live">repeats blocked <b id="st-dup">0</b></div>
  <div class="stat" id="weatherline">weather: clear</div>
  <div class="spacer"></div>
  <select id="preset" title="storm preset">
    <option value='{"intensity":"severe","target":"route-7"}'>severe @ route-7</option>
    <option value='{"intensity":"extreme","target":"event-bayfest"}'>extreme @ BayFest</option>
    <option value='{"intensity":"moderate","target":"crew-north"}'>moderate @ crew-north</option>
    <option value='{"intensity":"extreme","target":"route-12"}'>extreme @ route-12</option>
  </select>
  <button class="danger" id="inject">⚡ Inject storm</button>
  <button id="clear">Reset</button>
</header>

<div id="map"></div>

<aside>
  <div class="cards" id="cards"></div>
  <div class="feedwrap">
    <h2>Agent reasoning &amp; actions — live</h2>
    <div id="feed"></div>
  </div>
</aside>

<section id="openui">
  <div class="box">
    <h2>OpenUI — live status <span class="badge fallback" id="openui-badge">connecting…</span></h2>
    <div id="openui-card"></div>
  </div>
  <div class="box">
    <h2>[AGENT LOG] — live</h2>
    <div id="agentlog"></div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  const COLORS = { safe: '#22c55e', watch: '#f59e0b', threatened: '#ef4444', handled: '#3b82f6' };

  // ── map ──
  const map = L.map('map', { zoomControl: false, attributionControl: true });
  L.control.zoom({ position: 'bottomleft' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains: 'abcd', maxZoom: 19,
  }).addTo(map);
  map.setView([37.8, -122.15], 9); // Bay Area; refit to assets on first state

  const assetLayers = new Map(); // id → Leaflet layer
  const assetPoint = new Map();  // id → [lat, lon] (ping anchor)
  let stormCircle = null, stormDot = null, stormHeading = null, didFit = false;
  let trail = null, trailPts = [], trailStormId = null;

  function upsertAssetLayer(a) {
    const color = COLORS[a.status] ?? '#8b9bad';
    let layer = assetLayers.get(a.id);
    if (!layer) {
      layer =
        a.geometry.type === 'polyline'
          ? L.polyline(a.geometry.coordinates, { weight: 6, opacity: 0.95 })
          : L.circleMarker(a.geometry.coordinates, { radius: 11, weight: 3, fillOpacity: 0.85 });
      layer.bindTooltip(a.name, { direction: 'top' });
      layer.addTo(map);
      assetLayers.set(a.id, layer);
      const pts = a.geometry.type === 'polyline' ? a.geometry.coordinates : [a.geometry.coordinates];
      assetPoint.set(a.id, pts[Math.floor(pts.length / 2)]);
    }
    layer.setStyle({ color, fillColor: color });
    const el = typeof layer.getElement === 'function' ? layer.getElement() : null;
    if (el) el.classList.toggle('threat-pulse', a.status === 'threatened');
  }

  function updateStorm(w) {
    if (!w) {
      [stormCircle, stormDot, stormHeading, trail].forEach((l) => l && map.removeLayer(l));
      stormCircle = stormDot = stormHeading = trail = null;
      trailPts = []; trailStormId = null;
      return;
    }
    const c = [w.center.lat, w.center.lon];
    const head = [w.center.lat + w.movement.dLat * 3, w.center.lon + w.movement.dLon * 3];
    if (w.id !== trailStormId) { trailStormId = w.id; trailPts = []; }
    const lastPt = trailPts[trailPts.length - 1];
    if (!lastPt || lastPt[0] !== c[0] || lastPt[1] !== c[1]) {
      trailPts.push(c);
      if (trailPts.length > 40) trailPts.shift();
    }
    if (!stormCircle) {
      stormCircle = L.circle(c, { radius: w.radius_km * 1000, className: 'storm-pulse', color: '#ef4444', weight: 2, fillColor: '#ef4444', fillOpacity: 0.22 }).addTo(map);
      stormDot = L.circleMarker(c, { radius: 5, color: '#fff', fillColor: '#ef4444', fillOpacity: 1 }).addTo(map);
      stormHeading = L.polyline([c, head], { color: '#ef4444', weight: 2, dashArray: '6 6' }).addTo(map);
      trail = L.polyline(trailPts, { color: '#ef4444', weight: 2, opacity: 0.35, dashArray: '2 8' }).addTo(map);
    } else {
      stormCircle.setLatLng(c).setRadius(w.radius_km * 1000);
      stormDot.setLatLng(c);
      stormHeading.setLatLngs([c, head]);
      trail.setLatLngs(trailPts);
    }
  }

  // Sonar ping where the agent just acted.
  function ping(assetId) {
    const latlng = assetPoint.get(assetId);
    if (!latlng) return;
    const m = L.circleMarker(latlng, { radius: 18, className: 'ping', color: '#3b82f6', weight: 3, fill: false }).addTo(map);
    setTimeout(() => map.removeLayer(m), 1400);
  }

  // ── cards ──
  const cardsEl = document.getElementById('cards');
  function renderCards(assets) {
    const now = Date.now();
    cardsEl.innerHTML = assets
      .map((a) => {
        const color = COLORS[a.status] ?? '#8b9bad';
        const dist = a.distanceKm != null ? ` · ${a.distanceKm} km` : '';
        const fresh = a.lastAction && now - new Date(a.lastAction.at).getTime() < 6000 ? ' fresh' : '';
        const last = a.lastAction ? `<div class="last">↳ ${esc(a.lastAction.summary)}</div>` : '';
        return `<div class="card${fresh}" style="border-left-color:${color}">
          <h3>${esc(a.name)} <span class="pill" style="background:${color}">${a.status.toUpperCase()}</span></h3>
          <div class="meta">${a.type.replaceAll('_', ' ')}${dist}</div>${last}</div>`;
      })
      .join('');
  }

  // ── feed: incremental prepend so entry animations + typewriter fire once ──
  const feedEl = document.getElementById('feed');
  const feedSeen = new Set();
  let newestFeedId = 0;
  function addFeed(ev) {
    if (feedSeen.has(ev.id)) return false;
    feedSeen.add(ev.id);
    if (ev.id < newestFeedId) return false; // reconnect replay of older history — already past it
    newestFeedId = ev.id;
    const div = document.createElement('div');
    div.className = `ev ${ev.type}`;
    div.innerHTML = `<span class="tag">${ev.type.toUpperCase()}</span><span class="t">${ev.ts.slice(11, 19)}Z</span><span class="txt"></span>`;
    const txt = div.querySelector('.txt');
    feedEl.prepend(div);
    while (feedEl.children.length > 80) feedEl.removeChild(feedEl.lastChild);
    if (ev.type === 'reasoning') typewrite(txt, ev.text);
    else txt.textContent = ev.text;
    if (ev.type === 'action' && ev.data?.input?.asset_id) ping(ev.data.input.asset_id);
    return true;
  }
  function typewrite(el, text) {
    let i = 0;
    const step = Math.max(1, Math.ceil(text.length / 110)); // finish in ~1.8s regardless of length
    const t = setInterval(() => {
      i += step;
      el.textContent = text.slice(0, i);
      if (i >= text.length) clearInterval(t);
    }, 16);
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

  // ── [AGENT LOG] terminal (seeded from state.agentLog, streamed via `agentlog` SSE) ──
  const agentlogEl = document.getElementById('agentlog');
  const logSeen = new Set();
  function addAgentLog(entry) {
    if (logSeen.has(entry.id)) return;
    logSeen.add(entry.id);
    const div = document.createElement('div');
    div.className = 'ln';
    div.innerHTML = `<span class="t">${entry.ts.slice(11, 19)}Z</span>${esc(entry.text)}`;
    agentlogEl.appendChild(div);
    while (agentlogEl.children.length > 250) agentlogEl.removeChild(agentlogEl.firstChild);
    agentlogEl.scrollTop = agentlogEl.scrollHeight;
  }

  // ── OpenUI status card: generated component when a key is configured,
  //    clearly-labeled local fallback card otherwise ──
  const cardEl = document.getElementById('openui-card');
  const badgeEl = document.getElementById('openui-badge');
  let openuiMode = 'fallback';
  let lastState = null;

  function renderLocalCard(s) {
    if (!s) return;
    const counts = s.assets.reduce((m, a) => ((m[a.status] = (m[a.status] ?? 0) + 1), m), {});
    cardEl.innerHTML = `<div class="localcard">
      <div class="row"><span>System</span><b>${s.agent.running ? 'AUTONOMOUS — RUNNING' : 'STOPPED'}</b></div>
      <div class="row"><span>Weather</span><b>${s.weather ? `${esc(s.weather.severity)} ${esc(s.weather.kind)} · ETA ~${s.weather.eta_minutes} min` : 'clear'}</b></div>
      <div class="row"><span>Assets</span><b><span style="color:var(--safe)">${counts.safe ?? 0} safe</span> · <span style="color:var(--watch)">${counts.watch ?? 0} watch</span> · <span style="color:var(--threatened)">${counts.threatened ?? 0} threatened</span> · <span style="color:var(--handled)">${counts.handled ?? 0} handled</span></b></div>
      <div class="row"><span>Decisions / actions / repeats blocked</span><b>${s.stats?.decisions ?? 0} / ${s.stats?.actionsExecuted ?? 0} / ${s.stats?.duplicatesBlocked ?? 0}</b></div>
      <div class="row"><span>Brain</span><b>${esc(s.agent.model)}</b></div>
    </div>`;
  }

  async function refreshOpenUICard() {
    try {
      const r = await fetch('/api/ui/openui-card');
      const data = await r.json().catch(() => ({}));
      if (r.ok && data.content) {
        openuiMode = 'generated';
        badgeEl.className = 'badge gen';
        badgeEl.textContent = `generated ${data.generatedAt.slice(11, 19)}Z`;
        const frame = document.createElement('iframe');
        frame.setAttribute('sandbox', ''); // no scripts, no same-origin
        frame.srcdoc = `<body style="margin:0;background:#11161d;color:#e8eef5;font-family:sans-serif">${data.content}</body>`;
        cardEl.replaceChildren(frame);
      } else {
        openuiMode = 'fallback';
        badgeEl.className = r.status === 503 ? 'badge fallback' : 'badge err';
        badgeEl.textContent = r.status === 503 ? 'local fallback — no OpenUI key' : `OpenUI error: ${(data.error ?? r.status + '').slice(0, 60)}`;
        renderLocalCard(lastState);
      }
    } catch (e) {
      openuiMode = 'fallback';
      badgeEl.className = 'badge err';
      badgeEl.textContent = 'OpenUI unreachable — local fallback';
      renderLocalCard(lastState);
    }
  }
  setInterval(refreshOpenUICard, 45_000);

  // ── header + controls ──
  const dot = document.getElementById('dot'), conn = document.getElementById('conn');
  document.getElementById('inject').onclick = () =>
    fetch('/api/demo/inject-storm', { method: 'POST', headers: { 'content-type': 'application/json' }, body: document.getElementById('preset').value });
  document.getElementById('clear').onclick = () => fetch('/api/demo/clear', { method: 'POST' });

  function applyState(s) {
    document.getElementById('tick').textContent = s.tick;
    document.getElementById('st-dec').textContent = s.stats?.decisions ?? 0;
    document.getElementById('st-act').textContent = s.stats?.actionsExecuted ?? 0;
    document.getElementById('st-dup').textContent = s.stats?.duplicatesBlocked ?? 0;
    const wl = document.getElementById('weatherline');
    wl.textContent = s.weather
      ? `⛈ ${s.weather.severity} ${s.weather.kind} — ETA ~${s.weather.eta_minutes} min (conf ${s.weather.confidence})`
      : 'weather: clear';
    wl.classList.toggle('weather-alert', Boolean(s.weather));
    s.assets.forEach(upsertAssetLayer);
    if (!didFit) {
      const all = s.assets.flatMap((a) => (a.geometry.type === 'polyline' ? a.geometry.coordinates : [a.geometry.coordinates]));
      map.fitBounds(L.latLngBounds(all).pad(0.12));
      didFit = true;
    }
    updateStorm(s.weather);
    renderCards(s.assets);
    for (const ev of s.feed) addFeed(ev);
    for (const entry of s.agentLog ?? []) addAgentLog(entry);
    lastState = s;
    if (openuiMode === 'fallback') renderLocalCard(s);
  }

  // ── SSE ──
  const es = new EventSource('/api/stream');
  es.onopen = () => { dot.className = 'dot live'; conn.textContent = 'live'; };
  es.onerror = () => { dot.className = 'dot down'; conn.textContent = 'reconnecting…'; };
  es.addEventListener('state', (e) => applyState(JSON.parse(e.data)));
  es.addEventListener('feed', (e) => addFeed(JSON.parse(e.data)));
  es.addEventListener('agentlog', (e) => addAgentLog(JSON.parse(e.data)));
  refreshOpenUICard();
</script>
</body>
</html>
