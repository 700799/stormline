# Render blueprint — one-click deploy (New + → Blueprint → this repo).
# Secrets are sync:false → Render prompts for them in the dashboard.
services:
  - type: web
    name: stormline
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: POLL_SECONDS
        value: "15"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: anthropic/claude-sonnet-4.5
      - key: COMPOSIO_API_KEY
        sync: false
      - key: SLACK_CHANNEL_ID
        sync: false
      - key: DEMO_EMAIL_TO
        sync: false
      - key: OPENUI_API_KEY
        sync: false
      - key: CLICKHOUSE_URL
        sync: false
      - key: CLICKHOUSE_PASSWORD
        sync: false
